# docker compose up --build      GUI -> http://localhost:8501     API -> http://localhost:8000/docs
services:
  gui:
    build: .
    image: rag-mini-project
    ports: ["8501:8501"]
    env_file: .env
    volumes: ["rag_data:/app/data"]          # the index survives restarts
    restart: unless-stopped

  api:
    build: .
    image: rag-mini-project
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["rag_data:/app/data"]          # same index as the GUI
    restart: unless-stopped
    # Ollama running on your own PC (Linux): uncomment so that host.docker.internal works
    # extra_hosts: ["host.docker.internal:host-gateway"]

volumes:
  rag_data:
